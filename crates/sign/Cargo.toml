[package]
name = "pdftool-sign"
description = "Digitale PDF-Signaturen prüfen und erstellen (PAdES) – ohne UI und ohne PDFium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pdftool-core.workspace = true
lopdf.workspace = true
thiserror.workspace = true
tracing.workspace = true
cms.workspace = true
x509-cert.workspace = true
der.workspace = true
spki.workspace = true
rsa.workspace = true
p256.workspace = true
p384.workspace = true
sha1.workspace = true
sha2.workspace = true
p12-keystore.workspace = true
rand_core.workspace = true

# Im Browser (wasm32-unknown-unknown): rand_core 0.6 nutzt getrandom 0.2, das dort das Feature
# `js` braucht (Zufall aus crypto.getRandomValues). Nur ein Feature-Schalter, keine neue Crate im Baum.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }

