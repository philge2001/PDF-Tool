[package]
name = "pdftool-core"
description = "Dokumentmodell, Annotationen, Undo/Redo und Speichern – ohne UI und ohne PDFium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lopdf.workspace = true
thiserror.workspace = true
tracing.workspace = true
zune-jpeg.workspace = true
ttf-parser.workspace = true
subsetter.workspace = true
png.workspace = true
jpeg-encoder.workspace = true
zip.workspace = true
similar.workspace = true
getrandom.workspace = true
web-time.workspace = true

# Im Browser (wasm32-unknown-unknown) kommen Zufallszahlen von crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
# Zeitlimits im Textvergleich über web-time statt std::time (sonst Absturz im Browser).
similar = { workspace = true, features = ["wasm32_web_time"] }

[lints]
workspace = true
