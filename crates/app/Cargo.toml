[package]
name = "pdftool-app"
description = "PDF Tool Desktop-App (eframe/egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pdftool"
path = "src/main.rs"

[dependencies]
pdftool-core.workspace = true
pdftool-render.workspace = true
ureq.workspace = true
pdftool-sign.workspace = true
der.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
eframe.workspace = true
rfd.workspace = true
# Texterkennung (Feature "ocr"): baut Tesseract mit – braucht CMake und einen C++-Compiler.
pdftool-ocr = { workspace = true, optional = true }

[features]
default = ["ocr"]
ocr = ["dep:pdftool-ocr"]

[lints]
workspace = true
