[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/sign", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Zentrale Versionsverwaltung: Crates erben mit `foo.workspace = true`.
[workspace.dependencies]
foliocraft-core = { path = "crates/core" }
foliocraft-render = { path = "crates/render" }
foliocraft-sign = { path = "crates/sign" }

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
lopdf = { version = "0.46", default-features = false }
# JPEG dekodieren (reines Rust) – zum Schwärzen von Bildbereichen in Scans.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# Schriften lesen (Glyphen, Breiten) und als Teilmenge einbetten (Phase 6).
ttf-parser = "0.25"
subsetter = "0.2.6"
# PNG lesen (reines Rust) – Bilder einfügen/ersetzen (Phase 6).
png = "0.18"
# Ohne `image`-Feature: wir brauchen nur rohe RGBA-Bytes, keine image-Crate.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# glow (OpenGL) statt wgpu: schnellerer Build, weniger Abhängigkeiten, reicht für 2D.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "persistence", "wayland", "x11",
] }
rfd = "0.17"
# HTTP für Zeitstempeldienste (RFC 3161); TLS über rustls, damit auch https-Dienste gehen.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# Digitale Signaturen (Phase 4) – RustCrypto, reines Rust, MIT/Apache.
# Bewusst der stabile 0.2/0.7/0.9/0.13-Stand: die nächste Generation ist noch Release-Candidate.
cms = "0.2.3"                                                # CMS/PKCS#7 SignedData lesen und bauen
x509-cert = { version = "0.2.5", features = ["builder"] }   # Zertifikate lesen, Testzertifikate bauen
der = { version = "0.7", features = ["oid", "std", "derive"] } # ASN.1-DER-Kodierung
spki = "0.7"                                                 # öffentliche Schlüssel aus Zertifikaten
rsa = { version = "0.9", features = ["sha2"] }              # RSA-Signaturen (PKCS#1 v1.5)
p256 = "0.13"                                                # ECDSA mit Kurve P-256
p384 = "0.13"                                                # ECDSA mit Kurve P-384
sha1 = { version = "0.10", features = ["oid"] }             # SHA-1 nur zum PRÜFEN alter Signaturen
sha2 = { version = "0.10", features = ["oid"] }             # SHA-256/384/512
rand_core = { version = "0.6", features = ["getrandom"] }  # sichere Zufallszahlen (Schlüssel, Seriennummern)
p12-keystore = "0.2.1"                                       # PKCS#12-Dateien (.p12/.pfx) lesen/schreiben

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Abhängigkeiten auch im Debug-Build optimieren: macht PDFium-nahe Bitmap-Kopien
# und egui deutlich schneller, unser eigener Code bleibt gut debugbar.
opt-level = 2
