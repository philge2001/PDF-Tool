name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Systembibliotheken für eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: bash
        # Fehlgeschlagene Tests zusätzlich als Annotation ausgeben (über die API lesbar,
        # auch wenn die Log-Dateien nicht erreichbar sind).
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -E "panicked|FAILED|^---- " test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
